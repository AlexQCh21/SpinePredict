{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!---------->
    <link rel="stylesheet" href="{% static 'styles/auth.css' %}" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>Hospital Regional - Login</title>
    <link
      rel="icon"
      type="image/png"
      href="{% static 'img/logo-hospital-transparente.png' %}"
    />
  </head>
  <body>
    <header
      class="d-flex vh-100 vw-100 container-fluid justify-content-center align-items-center"
    >
      <section class="contenedor_login row">
        <div class="form_login col">
          <img src="" alt="" />
          <h1>HOSPITAL</h1>
          <span>Regional Eleazar Guzmán Barrón</span>
          <form class="fomulario-login" method="POST">
            {% csrf_token %}
            <div class="contenedor_input_login">
              <div class="icon-input">
                <i class="bi bi-person-vcard"></i>
              </div>
              <!-- <input type="text" class="inp_user" required="required" /> -->
              {{ form.username }}

              <p class="p-user">Usuario</p>
            </div>

            <div class="contenedor_input_login">
              <!-- <input type="password" class="inp_pass" required="required" /> -->
              {{ form.password }}

              <div class="icon-input">
                <i class="bi bi-shield-lock"></i>
              </div>
              <p class="p-pass">Contraseña</p>
            </div>

            <div class="contenedor-btn">
              <input type="submit" value="Ingresar" />
              <div class="icono-btn">
                <i class="bi bi-arrow-bar-right"></i>
              </div>
            </div>
          </form>

          <div class="leyenda">
            <i class="bi bi-shield-exclamation"></i>
            Solo personal autorizado
          </div>

          <div class="leyenda2">
            <i class="bi bi-check-circle-fill"></i>
            Diagnósticos seguros y confiables
          </div>
        </div>
        <div class="banner_login col">
          <!-- banner -->
          <img
            src="{% static 'img/logo-hospital-transparente.png' %}"
            alt="Logo del hospital"
            width="150"
          />
          <style>
            .banner_login {
              background-image: url("{% static 'img/banner-login.png' %}");
              background-position: center;
              background-size: cover;
            }
          </style>
        </div>
      </section>
    </header>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>

  {% if messages %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
        {% for message in messages %}
            Swal.fire({
                icon: '{% if "error" in message.tags %}error{% elif "warning" in message.tags %}warning{% else %}info{% endif %}',
                title: '{% if "error" in message.tags %}¡Bloqueado!{% else %}¡Advertencia!{% endif %}',
                text: '{{ message }}',
                confirmButtonText: 'Aceptar'
            });
        {% endfor %}
    });
  </script>
  {% endif %}

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</html>
